url: https://github.com/FragrantLotus/dsh-plugin-chinese
name: FragrantLotus/dsh-plugin-chinese
category: ui
description:
  en: "Fills in a Chinese description for every installed DSH plugin that ships only an English one, at startup and again after each plugin change, and never rewrites a plugin name. Plugins that already export a locale folder show the new text on refresh; ones that had no locale export are patched and need one restart."
  zh: 给只提供英文简介的已安装 DSH 插件自动补上中文简介，启动时以及每次插件变动后各跑一次，插件名称一律不改。原本已导出语言包的插件刷新页面即生效，原本没有语言包导出的会自动补上，需重启一次。
